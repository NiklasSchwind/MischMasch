[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "misch-masch"
version = "0.1.0"
description = "Conditional diffusion emulator for monthly regional tas/pr from a GMT trajectory"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
]

[project.scripts]
misch-masch-train = "run_access_esm:main"
misch-masch-infer = "inference:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["misch_masch*"]
